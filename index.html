<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SIAPBOS V3 - Sistem Informasi Administrasi Pertanggungjawaban BOSP</title>
  
  <link href="https://googleapis.com" rel="stylesheet">
  <link rel="stylesheet" href="https://cloudflare.com">
  
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', sans-serif;
      
      /* LATAR BELAKANG PREMIUM HYPER-COLOR: BERGERAK HIDUP */
      background: linear-gradient(-45deg, #0f172a, #047857, #1d4ed8, #6d28d9, #065f46);
      background-size: 300% 300%;
      animation: gradientFluid 10s ease infinite;
      position: relative;
    }

    /* MATRIKS GRID DIGITAL MENYALA SAMAR */
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(56, 189, 248, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(56, 189, 248, 0.05) 1px, transparent 1px);
      background-size: 400px 40px;
      z-index: 2;
      pointer-events: none;
    }

    /* LAYER CAHAYA NEON DI BELAKANG PANEL (AMBIENT GLOW) */
    body::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.3) 0%, rgba(34, 197, 94, 0.2) 50%, transparent 100%);
      filter: blur(60px);
      z-index: 1;
      pointer-events: none;
    }

    #bg-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 3;
      pointer-events: none;
    }

    #loader-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* KARTU PANEL KACA GLOSSY BERGRAFIK WARNA */
    .loader-panel {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 2.5rem 2rem;
      border-radius: 30px;
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      box-shadow: 
        0 30px 60px rgba(0, 0, 0, 0.5),
        0 0 50px rgba(56, 189, 248, 0.25),
        0 0 100px rgba(34, 197, 94, 0.15);
      max-width: 400px;
      width: 85%;
    }

    .logo-frame {
      position: relative;
      display: inline-flex;
    }

    /* DENYUT CAHAYA HIJAU NEON PADA LOGO */
    .logo-frame::after {
      content: '';
      position: absolute;
      inset: -15px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(34, 197, 94, 0.4) 0%, transparent 70%);
      animation: pulseGlow 2s infinite ease-in-out;
      z-index: -1;
    }

    .brand-name {
      color: #ffffff;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 2px;
      margin: 0;
      /* TEKS GRADASI WARNA MENYALA */
      background: linear-gradient(135deg, #ffffff 30%, #38bdf8 70%, #4ade80 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.5));
    }

    .brand-tagline {
      color: #a7f3d0; 
      font-size: 9.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2.5px;
    }

    /* BAR PROGRESS WARNA-WARNI */
    .track-bar {
      width: 100%;
      height: 6px;
      background-color: rgba(255, 255, 255, 0.08);
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 1.25rem;
    }

    .fill-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #4ade80, #3b82f6, #a855f7, #4ade80);
      background-size: 300% auto;
      border-radius: 99px;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.8);
      animation: shineProgress 1.5s infinite linear, loadFake 4s forwards cubic-bezier(0.1, 0.8, 0.1, 1);
    }

    .log-terminal {
      color: #cbd5e1;
      font-size: 11.5px;
      font-weight: 600;
      margin: 0 0 1.5rem 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      min-height: 20px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.4);
    }

    /* TOMBOL CYBER NEON MENYALA TERANG */
    .login-btn {
      background: linear-gradient(135deg, #059669 0%, #1d4ed8 100%);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 0.85rem 2.4rem;
      font-size: 11.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 2px;
      border-radius: 16px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      box-shadow: 
        0 0 20px rgba(4, 120, 87, 0.4),
        0 0 30px rgba(29, 78, 216, 0.3);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .login-btn:hover {
      background: linear-gradient(135deg, #10b981 0%, #2563eb 100%);
      box-shadow: 
        0 0 30px rgba(74, 222, 128, 0.6),
        0 0 30px rgba(56, 189, 248, 0.6);
      transform: translateY(-3px);
    }

    #main-app-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      opacity: 0;
      transform: scale(1.01);
      transition: opacity 0.6s ease-in-out, transform 0.6s ease-in-out;
    }

    /* KEYFRAMES ANIMASI */
    @keyframes gradientFluid {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes pulseGlow {
      0%, 100% { transform: scale(0.9); opacity: 0.4; }
      50% { transform: scale(1.3); opacity: 0.8; }
    }

    @keyframes shineProgress {
      0% { background-position: 0% center; }
      100% { background-position: 300% center; }
    }

    @keyframes loadFake {
      0% { width: 0%; }
      50% { width: 65%; }
      85% { width: 92%; }
      100% { width: 98%; }
    }

    .fade-out-portal { opacity: 0 !important; visibility: hidden !important; }
    .reveal-frame { opacity: 1 !important; transform: scale(1) !important; }
  </style>
</head>
<body>

  <!-- KANVAS PARTIKEL BINTANG MENYALA -->
  <canvas id="bg-canvas"></canvas>

  <!-- LAYER PRELOADER COLORFUL -->
  <div id="loader-overlay">
    <div class="loader-panel">
      
      <!-- LOGO SIAPBOS DIKUNCI UKURANNYA -->
      <div class="logo-frame" style="margin-bottom: 1rem;">
        <img src="https://i.ibb.co.com/SXGrcCSn/LOGO-SIAP-BOS.png" style="width: 220px; max-width: 100%; height: auto; filter: drop-shadow(0 0 20px rgba(74, 222, 128, 0.4));">
      </div>
      
      <h1 class="brand-name">SIAP BOS V3</h1>
      <p class="brand-tagline" style="font-size: 9px; max-width: 320px; margin: 0.5rem auto 1.5rem auto; line-height: 1.4;">Sistem Informasi Administrasi Pertanggungjawaban BOS</p>
      
      <div class="track-bar">
        <div class="fill-bar"></div>
      </div>
      
      <p class="log-terminal">
        <i class="fa-solid fa-circle-notch fa-spin"></i>
        <span id="log-text">Inisialisasi enkripsi SSL...</span>
      </p>

      <button class="login-btn" onclick="bypassToLogin()" style="margin-top: 0.5rem;">
        <span>Buka Halaman Login</span>
        <i class="fa-solid fa-arrow-right-to-bracket"></i>
      </button>

    </div>
  </div>

  <!-- IFRAME APLIKASI UTAMA (MASUKKAN URL /exec BAPAK DI SINI) -->
  <iframe 
    id="main-app-frame" 
    src="https://script.google.com/macros/s/AKfycbzBJQgrrQPwtCPbsYDJ-rrCuI0hglu8h-dKggAwgh-Xb4ycZUkHzMUXUL0OhKA6Kotlcw/exec" 
    onload="launchApp()">
  </iframe>

  <script>
    // 1. TERMINAL LOG SIMULASI AUTOMATION
    const logs = [
      "Mengamankan jalinan siber...",
      "Sinkronisasi database BOSP...",
      "Memetakan modul enkripsi...",
      "Memuat form lembar cetak dinas...",
      "Sistem siap, membuka gerbang login..."
    ];
    let currentLogIdx = 0;
    const logInterval = setInterval(() => {
      if (currentLogIdx < logs.length) {
        document.getElementById('log-text').innerText = logs[currentLogIdx];
        currentLogIdx++;
      } else {
        clearInterval(logInterval);
      }
    }, 800);

    // 2. RENDERING CANVAS PARTIKEL BINTANG WARNA-WARNI KILAU
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2.5 + 0.5;
        this.speedX = Math.random() * 0.6 - 0.3;
        this.speedY = Math.random() * -0.6 - 0.2; // Meluncur ke atas lembut
        this.colorIndex = Math.floor(Math.random() * 2); // Acak antara warna biru atau hijau neon
        this.alpha = Math.random() * 0.6 + 0.3;
      }
      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        if (this.y < 0) {
          this.y = canvas.height;
          this.x = Math.random() * canvas.width;
        }
      }
      draw() {
        ctx.fillStyle = this.colorIndex === 0 ? `rgba(56, 189, 248, ${this.alpha})` : `rgba(74, 222, 128, ${this.alpha})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    for (let i = 0; i < 80; i++) {
      particles.push(new Particle());
    }

    function animateParticles() {
ctx.clearRect(0, 0, canvas.width, canvas.height);particles.forEach(p => {p.update();p.draw();});requestAnimationFrame(animateParticles);}animateParticles();// 3. FUNGSI BYPASS TRANSISI HALUS MASUK LOGINfunction bypassToLogin() {clearInterval(logInterval);const fillBar = document.querySelector('.fill-bar');if(fillBar) {fillBar.style.animation = 'none';fillBar.style.width = '100%';}document.getElementById('loader-overlay').classList.add('fade-out-portal');document.getElementById('main-app-frame').classList.add('reveal-frame');}function launchApp() {document.getElementById('log-text').innerText = "Koneksi berhasil terjalin!";setTimeout(bypassToLogin, 600);}
